# Full-context tests (@ActiveProfiles("test")): replaces the env-var placeholders of application.properties.
# The JwtDecoder and the Mongo repository are mocked, so nothing here is ever contacted.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost/realms/test
windfire.cors.allowed-origins=https://allowed.example
spring.mongodb.uri=mongodb://localhost:27017/restaurants
server.ssl.enabled=false
# The Mongo health indicator would try to connect and report DOWN
management.health.mongodb.enabled=false
# SSL metrics and the SSL health indicator read every SSL bundle, and the keycloak bundle's file is not present in tests (HOME_DIR unset)
spring.autoconfigure.exclude=org.springframework.boot.micrometer.metrics.autoconfigure.ssl.SslMetricsAutoConfiguration
management.health.ssl.enabled=false
