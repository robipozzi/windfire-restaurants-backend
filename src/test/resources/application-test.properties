# Full-context tests (@ActiveProfiles("test")): replaces the env-var placeholders of application.properties.
# The JwtDecoder and the Mongo repository are mocked, so nothing here is ever contacted.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost/realms/test
windfire.cors.allowed-origins=https://allowed.example
spring.data.mongodb.uri=mongodb://localhost:27017/restaurants
server.ssl.enabled=false
# The Mongo health indicator would try to connect and report DOWN
management.health.mongo.enabled=false
