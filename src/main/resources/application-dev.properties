##################################
##### Swagger UI / OpenAPI #####
##################################
# Local development only (run-windfire-restaurants-backend.sh starts with --spring.profiles.active=dev)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# When true, Swagger UI and API docs are reachable without a token
windfire.swagger.public=true

#################################
##### MongoDb (dev cluster) #####
#################################
# Atlas project windfire-dev; the password is prompted by run-windfire-restaurants-backend.sh.
# Only host and user are set here, never spring.mongodb.uri: tests run with profiles {test, dev}
# and must keep the application-test.properties URI.
windfire.mongodb.host=windfire-dev.dx6zesz.mongodb.net
windfire.mongodb.user=windfire-dev-app
