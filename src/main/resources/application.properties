#############################
##### Spring properties #####
#############################
spring.application.name=windfire-restaurants-backend
spring.main.lazy-initialization=true

################################
##### Server configuration #####
################################
# === Uncomment if you want to start server on non-default port (default port is 8080)
server.port=8081

##############################
##### Logging properties #####
##############################
debug=false
logging.level.root=info
logging.level.com.rpozzi.windfire=debug

##################################
##### Security configuration #####
##################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${KEYCLOAK_SERVER}:${KEYCLOAK_SERVER_PORT}/realms/windfire
# Keycloak client whose roles (resource_access.<client>.roles) are mapped to authorities; tokens must carry it in "aud"
windfire.security.api-client-id=windfire-restaurants-api
# Comma-separated list of exact origins allowed to call the API (no wildcard default)
windfire.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#############################
##### SSL configuration #####
#############################
### PEM certificate configuration - certificate and key generated by ssl/generate-ssl-cert.sh,
### signed by the Windfire Root CA (see windfire-security/ssl/createRootCA.sh)
# The path to the certificate
server.ssl.certificate=file:${HOME_DIR}/opt/windfire/ssl/certs/windfire-restaurants-backend.crt
# The path to the certificate's private key
server.ssl.certificate-private-key=file:${HOME_DIR}/opt/windfire/ssl/keystore/windfire-restaurants-backend.key
### Outbound trust for Keycloak only: the Windfire Keycloak Root CA (created by windfire-security/keycloak/security/setupTLS.sh).
### Used only by the JwtDecoder's RestTemplate (SecurityConfig); MongoDB Atlas and any other outbound TLS keep the JVM default trust.
spring.ssl.bundle.pem.keycloak.truststore.certificate=file:${HOME_DIR}/opt/keycloak/ssl/truststore/WindfireKeycloakRootCA.crt

##################################
##### Swagger UI / OpenAPI #####
##################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Off by default, so the Raspberry deployment (no profile) never serves them; the dev profile turns them on
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# When true, Swagger UI and API docs are reachable without a token
windfire.swagger.public=false

######################################
##### MongoDb Data source config #####
######################################
# Host and user are environment specific: the dev profile sets them for local runs (application-dev.properties);
# on Raspberry they come from MONGODB_HOST / MONGODB_USER in windfire-restaurants-backend.env (Ansible).
# No defaults: a missing value fails at startup instead of silently connecting to another environment.
windfire.mongodb.host=${MONGODB_HOST}
windfire.mongodb.user=${MONGODB_USER}
spring.mongodb.database=restaurants
spring.mongodb.uri=mongodb+srv://${windfire.mongodb.user}:${MONGODB_PASSWORD}@${windfire.mongodb.host}/${spring.mongodb.database}