#############################
##### Spring properties #####
#############################
spring.application.name=windfire-restaurants-backend
spring.main.lazy-initialization=true

################################
##### Server configuration #####
################################
# === Uncomment if you want to start server on non-default port (default port is 8080)
server.port=8081

##############################
##### Logging properties #####
##############################
debug=false
logging.level.root=info
logging.level.com.rpozzi.windfire=debug

##################################
##### Security configuration #####
##################################
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_SERVER}:${KEYCLOAK_SERVER_PORT}/realms/windfire-restaurants

#############################
##### SSL configuration #####
#############################
### Keystore configuration
# The format used for the keystore. It could be set either to PKCS12 or JKS
server.ssl.key-store-type=JKS
# The path to the keystore containing the certificate
server.ssl.key-store=classpath:keystore/windfire_restaurants_srvc.keystore.jks
# The password used to generate the certificate
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
# The alias mapped to the certificate
server.ssl.key-alias=windfire_restaurants_srvc