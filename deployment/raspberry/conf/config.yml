# SSH/sudo user; stages the application under its home folder
user: pi
group: pi
# System user and group the service runs as: no login shell, no supplementary groups (not in sudo)
service_user: windfire-restaurants
service_group: windfire-restaurants
remote_home_dir: /home/pi
local_home_dir: /Users/robertopozzi
remote_windfirerestaurants_dir: "{{ remote_home_dir }}/windfire-restaurants"
remote_windfirerestaurants_run_target_dir: "{{ remote_windfirerestaurants_dir }}/target"
# The service user's own copy of its TLS certificate and key
remote_windfirerestaurants_ssl_dir: "{{ remote_windfirerestaurants_dir }}/ssl"
windfirerestaurants_port: 8081
# Pi 3 cold start measured ~37 s to bind 8081 (2026-11-11); leave headroom for memory pressure
windfirerestaurants_startup_timeout: 180
windfirerestaurants_app_jar: windfire-restaurants-backend-0.0.1-SNAPSHOT.jar
windfirerestaurants_launch_script: start-windfire-restaurants-backend.sh
setenv_script: setenv.sh
local_windfirerestaurants_certs_dir: "{{ local_home_dir }}/opt/windfire/ssl/certs/raspberry"
local_windfirerestaurants_keystore_dir: "{{ local_home_dir }}/opt/windfire/ssl/keystore/raspberry"
# Shared folders (also used by other Windfire repos): the service no longer reads them, the playbook
# only removes this application's old certificate and key from there
remote_windfirerestaurants_certs_dir: "{{ remote_home_dir }}/opt/windfire/ssl/certs"
remote_windfirerestaurants_keystore_dir: "{{ remote_home_dir }}/opt/windfire/ssl/keystore"
remote_windfirerestaurants_certificate: "windfire-restaurants-backend.crt"
remote_windfirerestaurants_key: "windfire-restaurants-backend.key"
# Old shared Keycloak truststore folder: only its legacy JVM-wide JKS is removed from there
remote_keycloak_truststore_dir: "{{ remote_home_dir }}/opt/keycloak/ssl/truststore"
# Shared, root-owned CA folder installed by windfire-raspberry (configure-windfire-infra.sh --tags windfire_ca): this playbook only checks it
windfire_ca_dir: /etc/windfire/ca
# Windfire Keycloak Root CA, trusted only by the "keycloak" SSL bundle (application.properties)
keycloak_root_ca_certificate: "WindfireKeycloakRootCA.crt"
# Keycloak base URL as it appears in the token issuer (KEYCLOAK_ISSUER_URL), without /realms/<realm>: the application
# expects iss = <this>/realms/windfire. Same value as the auth server's KEYCLOAK_ISSUER_URL and Keycloak's
# keycloak_public_url; https://raspberry01:8443 without a public hostname. Signing keys are always fetched from the
# LAN JWKS endpoint, never over this URL.
keycloak_issuer_url: "https://auth.windfire.cc"
# Exact origins allowed to call the API, joined with commas into CORS_ALLOWED_ORIGINS
cors_allowed_origins:
  - "https://raspberry01:8445"
  # - "https://app.<domain>"
# MongoDB prod cluster (non-secret); the password is prompted by deploy.sh and stored with systemd-creds
mongodb_host: "windfire.rxdd4.mongodb.net"
mongodb_user: "windfire-prod-app"
