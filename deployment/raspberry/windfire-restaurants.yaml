--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# Software installation and configuration
- hosts: appserver
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
    keycloak_server: "{{ lookup('env', 'KEYCLOAK_SERVER') }}"
    keycloak_server_port: "{{ lookup('env', 'KEYCLOAK_SERVER_PORT') }}"
    mongodb_password: "{{ lookup('env', 'MONGODB_PASSWORD') }}"
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    ##############################################################
    ##### Windfire Restaurants backend stop application task #####
    ##############################################################
    - name: Stop Windfire Restaurants backend application if running
      ansible.builtin.systemd:
        name: windfire-restaurants-backend
        state: stopped
      failed_when: false
      ignore_errors: yes
    ###########################################################
    ##### Windfire Restaurants backend deployment section #####
    ###########################################################
    - name: Remove "{{ remote_windfirerestaurants_dir }}" remote directory
      file:
        path: "{{ remote_windfirerestaurants_run_target_dir }}"
        state: absent
    - name: Ensure "{{ remote_windfirerestaurants_run_target_dir }}" remote directory exists
      file:
        path: "{{ remote_windfirerestaurants_run_target_dir }}"
        state: directory 
    - name: Copy Windfire Restaurants backend application "{{ windfirerestaurants_app_jar }}" jar to remote server
      copy:
        src: "../../target/{{ windfirerestaurants_app_jar }}"
        dest: "{{ remote_windfirerestaurants_run_target_dir }}"
        owner: "{{ user }}"
        group: "{{ group }}"
    - name: Copy "{{ windfirerestaurants_launch_script }}" launch script to remote server
      copy:
        src: "../../{{ windfirerestaurants_launch_script }}"
        dest: "{{ remote_windfirerestaurants_dir }}/{{ windfirerestaurants_launch_script }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "{{ mode }}"
    - name: Copy "{{ setenv_script }}" script to remote server
      copy:
        src: "../../{{ setenv_script }}"
        dest: "{{ remote_windfirerestaurants_dir }}/{{ setenv_script }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "{{ mode }}"
    ###################################################################
    ##### Windfire Restaurants TLS certificate deployment section #####
    ###################################################################
    - name: Remove remote TLS directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ remote_windfirerestaurants_certs_dir }}"
        - "{{ remote_windfirerestaurants_keystore_dir }}"
    - name: Ensure remote TLS directories exist
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ remote_windfirerestaurants_certs_dir }}"
        - "{{ remote_windfirerestaurants_keystore_dir }}"
    - name: Copy Windfire Restaurants certificate "{{ remote_windfirerestaurants_certificate }}" to remote server
      copy:
        src: "{{ local_windfirerestaurants_certs_dir }}/{{ remote_windfirerestaurants_certificate }}"
        dest: "{{ remote_windfirerestaurants_certs_dir }}/{{ remote_windfirerestaurants_certificate }}"
        owner: "{{ user }}"
        group: "{{ group }}"
    - name: Copy Windfire Restaurants private key "{{ remote_windfirerestaurants_key }}" to remote server
      copy:
        src: "{{ local_windfirerestaurants_keystore_dir }}/{{ remote_windfirerestaurants_key }}"
        dest: "{{ remote_windfirerestaurants_keystore_dir }}/{{ remote_windfirerestaurants_key }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0600"
    ###########################################################
    ##### Keycloak Root CA certificate deployment section #####
    ###########################################################
    - name: Ensure remote Keycloak truststore directory exists
      file:
        path: "{{ remote_keycloak_truststore_dir }}"
        state: directory
    - name: Copy Windfire Keycloak Root CA "{{ keycloak_root_ca_certificate }}" to remote server
      copy:
        src: "{{ local_keycloak_truststore_dir }}/{{ keycloak_root_ca_certificate }}"
        dest: "{{ remote_keycloak_truststore_dir }}/{{ keycloak_root_ca_certificate }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0644"
    - name: Remove legacy JVM-wide Keycloak truststore, replaced by the PEM SSL bundle
      file:
        path: "{{ remote_keycloak_truststore_dir }}/keycloak.truststore.jks"
        state: absent
    ################################################################
    ##### Windfire Restaurants backend systemd service section #####
    ################################################################
    - name: Ensure "{{ remote_windfirerestaurants_dir }}/logs" remote directory exists
      file:
        path: "{{ remote_windfirerestaurants_dir }}/logs"
        state: directory
    - name: Template Windfire Restaurants backend environment file
      template:
        src: "{{ src_dir }}/templates/windfire-restaurants-backend.env.j2"
        dest: "{{ remote_windfirerestaurants_dir }}/windfire-restaurants-backend.env"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0600"
    ####################################################################
    ##### Windfire Restaurants backend secrets (systemd-creds) section #####
    ####################################################################
    - name: Build plaintext secrets blob for systemd-creds (never written to disk)
      set_fact:
        windfire_secrets_blob: |
          MONGODB_PASSWORD={{ mongodb_password }}
      no_log: true
    - name: Ensure /etc/credstore.encrypted directory exists
      file:
        path: /etc/credstore.encrypted
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Remove previous encrypted secrets credential, if any
      file:
        path: /etc/credstore.encrypted/windfire-restaurants-backend-secrets
        state: absent
    - name: Encrypt Windfire Restaurants backend secrets with systemd-creds
      command:
        cmd: systemd-creds encrypt --name=windfire-restaurants-backend-secrets --with-key=host - /etc/credstore.encrypted/windfire-restaurants-backend-secrets
        stdin: "{{ windfire_secrets_blob }}"
      no_log: true
      notify: reload systemd
    - name: Template Windfire Restaurants backend systemd unit
      template:
        src: "{{ src_dir }}/templates/windfire-restaurants-backend.service.j2"
        dest: "/etc/systemd/system/windfire-restaurants-backend.service"
      notify: reload systemd
    - name: Reload systemd and start Windfire Restaurants backend service
      systemd:
        daemon_reload: yes
        name: windfire-restaurants-backend
        state: started
        enabled: yes
    - name: Verify Windfire Restaurants backend is listening on port 8081
      wait_for:
        port: 8081
        host: 127.0.0.1
        timeout: 30
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes