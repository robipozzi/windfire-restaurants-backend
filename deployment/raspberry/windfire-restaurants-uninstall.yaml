--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# Software installation and configuration for Raspberry PI box
- hosts: appserver
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    ##############################################################
    ##### Windfire Restaurants backend stop application task #####
    ##############################################################
    - name: Stop and disable Windfire Restaurants backend service if running
      systemd:
        name: windfire-restaurants-backend
        state: stopped
        enabled: no
      ignore_errors: yes
    - name: Remove Windfire Restaurants backend systemd unit file
      file:
        path: /etc/systemd/system/windfire-restaurants-backend.service
        state: absent
    - name: Reload systemd after removing unit file
      systemd:
        daemon_reload: yes
    ##############################################################
    ##### Windfire Restaurants backend un-deployment section #####
    ##############################################################
    - name: Remove "{{ remote_windfirerestaurants_dir }}" remote directory
      file:
        path: "{{ remote_windfirerestaurants_run_target_dir }}"
        state: absent